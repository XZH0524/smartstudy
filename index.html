<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b32">
  <meta name="description" content="Smart Study — bilingual English and mathematics practice for secondary school students.">
  <title>Smart Study</title>
  <link rel="stylesheet" href="styles.css">
  <script src="questions.js" defer></script>
  <script src="core.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main" id="skip-link">跳至主要内容</a>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="Smart Study"><span class="brand-mark" aria-hidden="true">s<span>·</span></span><span>Smart<br>Study<span class="brand-dot">.</span></span></a>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="sidebar-bottom"><span class="local-icon" aria-hidden="true">◉</span><p id="local-label"></p><span class="version">v1.0</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb" id="breadcrumb"></div><div class="topbar-actions"><label class="sr-only" for="language" id="language-label">界面语言</label><select id="language"><option value="zh">中文</option><option value="en">English</option></select><span class="avatar" aria-hidden="true">S</span></div></header>
      <main id="main" tabindex="-1"></main>
      <footer id="footer"></footer>
    </div>
  </div>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <div id="storage-notice" class="storage-notice" role="alert" hidden></div>
  <dialog id="confirm-dialog"><form method="dialog"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div class="dialog-actions"><button value="cancel" class="button secondary" id="dialog-cancel"></button><button value="confirm" class="button danger" id="dialog-confirm"></button></div></form></dialog>
</body>
</html>
